<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1280"
    height="320"
    viewBox="0 0 1280 320">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#05060A">
<animate attributeName="stop-color"
values="#05060A;#08111C;#05060A"
dur="10s"
repeatCount="indefinite"/>
</stop>

<stop offset="100%" stop-color="#0F172A">
<animate attributeName="stop-color"
values="#0F172A;#0A1A33;#0F172A"
dur="10s"
repeatCount="indefinite"/>
</stop>
</linearGradient>

<linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
<stop offset="50%" stop-color="#00E5FF" stop-opacity=".15"/>
<stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="5" result="coloredBlur"/>
<feMerge>
<feMergeNode in="coloredBlur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<pattern
id="grid"
width="40"
height="40"
patternUnits="userSpaceOnUse">

<path
d="M40 0H0V40"
fill="none"
stroke="#103050"
stroke-width="1"
opacity=".25"/>

</pattern>

</defs>

<rect
width="1280"
height="320"
fill="url(#bg)"/>

<rect
width="1280"
height="320"
fill="url(#grid)"/>

<g opacity=".4">

<circle
cx="200"
cy="80"
r="3"
fill="#00E5FF">

<animate
attributeName="opacity"
values=".2;1;.2"
dur="4s"
repeatCount="indefinite"/>

</circle>

<circle
cx="600"
cy="210"
r="2"
fill="#00E5FF">

<animate
attributeName="opacity"
values=".1;1;.1"
dur="6s"
repeatCount="indefinite"/>

</circle>

<circle
cx="1000"
cy="110"
r="3"
fill="#00E5FF">

<animate
attributeName="opacity"
values=".3;1;.3"
dur="5s"
repeatCount="indefinite"/>

</circle>

<circle
cx="1160"
cy="260"
r="2"
fill="#00E5FF">

<animate
attributeName="opacity"
values=".2;1;.2"
dur="7s"
repeatCount="indefinite"/>

</circle>

</g>

<rect
x="-1280"
y="0"
width="1280"
height="320"
fill="url(#scan)">

<animate
attributeName="x"
from="-1280"
to="1280"
dur="5s"
repeatCount="indefinite"/>

</rect>

<text
x="80"
y="120"
font-size="52"
font-family="JetBrains Mono, monospace"
font-weight="700"
fill="#FFFFFF"
filter="url(#glow)">

UMER KHAN

</text>

<text
x="82"
y="160"
font-size="22"
font-family="JetBrains Mono, monospace"
fill="#00E5FF">

Building Software • AI • Web Engineering

</text>

<text
x="82"
y="210"
font-size="18"
font-family="JetBrains Mono, monospace"
fill="#7DD3FC">

Initializing portfolio...

</text>

<rect
x="310"
y="194"
width="10"
height="22"
fill="#00E5FF">

<animate
attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</rect>

<line
x1="80"
y1="250"
x2="1200"
y2="250"
stroke="#00E5FF"
stroke-opacity=".25"
stroke-width="1"/>

<text
x="80"
y="285"
font-size="13"
font-family="JetBrains Mono, monospace"
fill="#3BA4F2">

SYSTEM STATUS :: ONLINE

</text>

<text
x="980"
y="285"
font-size="13"
font-family="JetBrains Mono, monospace"
fill="#3BA4F2">

github.com/se-umerkhan

</text>

</svg>
