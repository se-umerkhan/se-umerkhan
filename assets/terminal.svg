<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
width="1280"
height="720"
viewBox="0 0 1280 720">

<defs>

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#05070B"/>
<stop offset="100%" stop-color="#0B1323"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur stdDeviation="4" result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

<linearGradient id="header"
x1="0%"
y1="0%"
x2="0%"
y2="100%">

<stop offset="0%" stop-color="#23272F"/>

<stop offset="100%" stop-color="#171B22"/>

</linearGradient>

</defs>

<!-- Background -->

<rect
width="1280"
height="720"
fill="#02040A"/>

<!-- Window -->

<rect
x="60"
y="40"
rx="18"
ry="18"
width="1160"
height="640"
fill="url(#bg)"
stroke="#1E3A5F"
stroke-width="2"/>

<!-- Header -->

<rect
x="60"
y="40"
rx="18"
ry="18"
width="1160"
height="52"
fill="url(#header)"/>

<!-- Fix rounded bottom -->

<rect
x="60"
y="70"
width="1160"
height="22"
